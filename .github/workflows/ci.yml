name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build -- --base-href /Chnorrlimorrli/

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Apply all migrations to a fresh database
        run: supabase db start
      - name: Generated types match the schema
        run: |
          supabase gen types typescript --local > src/types/database.types.ts
          git diff --exit-code src/types/database.types.ts
