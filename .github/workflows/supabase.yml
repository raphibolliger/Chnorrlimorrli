name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'lisritbuqnjhdsguzrnu' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set, deployment skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: 2.121.0
      - name: Link project
        if: steps.credentials.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push
      - name: Configure auth (login code mails over ACS SMTP)
        if: steps.credentials.outputs.ready == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://raphibolliger.github.io/Chnorrlimorrli' }}
          SUPABASE_SMTP_PASSWORD: ${{ secrets.SUPABASE_SMTP_PASSWORD }}
        run: supabase/scripts/configure-auth.sh
      - name: Upload seed product images
        if: steps.credentials.outputs.ready == 'true'
        run: |
          service_key=$(supabase projects api-keys --project-ref "$PROJECT_REF" --reveal -o json \
            | jq -r 'map(select(.name == "service_role" or .type == "secret")) | first | .api_key')
          echo "::add-mask::$service_key"
          SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$service_key" \
            supabase/scripts/upload-seed-images.sh
      - name: Set function secrets
        if: steps.credentials.outputs.ready == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'noreply@chnorrlimorrli.ch' }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO }}
          MAIL_REDIRECT_TO: ${{ vars.MAIL_REDIRECT_TO }}
          ADMIN_NOTIFICATION_TO: ${{ vars.ADMIN_NOTIFICATION_TO }}
          SITE_URL: ${{ vars.SITE_URL || 'https://raphibolliger.github.io/Chnorrlimorrli' }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          : > function-secrets.env
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ACS_CONNECTION_STRING MAIL_FROM MAIL_REPLY_TO MAIL_REDIRECT_TO ADMIN_NOTIFICATION_TO SITE_URL ALLOWED_ORIGINS; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> function-secrets.env
            fi
          done
          if [ -s function-secrets.env ]; then
            supabase secrets set --env-file function-secrets.env
          fi
          rm function-secrets.env
      - name: Deploy edge functions
        if: steps.credentials.outputs.ready == 'true' && hashFiles('supabase/functions/*/index.ts') != ''
        run: supabase functions deploy --use-api
