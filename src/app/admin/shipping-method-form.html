<app-section-card [title]="method().name" [icon]="kindIcon()" [subtitle]="kindLabel()">
  <form class="grid gap-4" (submit)="$event.preventDefault(); save()">
    <div class="grid gap-4 md:grid-cols-[1fr_minmax(0,140px)]">
      <label class="block">
        <span [class]="labelClass">Name an der Kasse</span>
        <input
          name="name"
          [class]="fieldClass"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
        />
      </label>
      <label class="block">
        <span [class]="labelClass">Reihenfolge</span>
        <input
          name="sortOrder"
          type="number"
          [class]="fieldClass"
          [ngModel]="sortOrder()"
          (ngModelChange)="sortOrder.set($event)"
        />
      </label>
    </div>

    <label class="block">
      <span [class]="labelClass">Beschreibung für Kundinnen und Kunden</span>
      <textarea
        name="description"
        rows="2"
        [class]="textareaClass"
        [ngModel]="description()"
        (ngModelChange)="description.set($event)"
      ></textarea>
    </label>

    <label class="flex items-center gap-2 text-sm font-medium text-gray-800">
      <input
        type="checkbox"
        name="active"
        [class]="checkboxClass"
        [ngModel]="active()"
        (ngModelChange)="active.set($event)"
      />
      An der Kasse anbieten
    </label>

    <fieldset class="grid gap-2">
      <legend [class]="labelClass">Preisstufen nach Warenwert</legend>
      @for (rate of rates(); track $index; let index = $index) {
        <div
          class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_2.5rem] items-end gap-2 md:max-w-lg"
        >
          <label class="block">
            <span [class]="hintClass + ' mt-0 mb-1'">Warenwert ab CHF</span>
            <input
              [class]="fieldClass"
              [ngModel]="rate.from"
              (ngModelChange)="updateRate(index, 'from', $event)"
              [ngModelOptions]="{ standalone: true }"
              inputmode="decimal"
            />
          </label>
          <label class="block">
            <span [class]="hintClass + ' mt-0 mb-1'">Versandkosten CHF</span>
            <input
              [class]="fieldClass"
              [ngModel]="rate.price"
              (ngModelChange)="updateRate(index, 'price', $event)"
              [ngModelOptions]="{ standalone: true }"
              inputmode="decimal"
            />
          </label>
          @if (rates().length > 1) {
            <button
              type="button"
              (click)="removeRate(index)"
              class="inline-flex size-10 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-danger"
              aria-label="Preisstufe entfernen"
            >
              <app-icon name="trash" [size]="18" />
            </button>
          }
        </div>
      }
      <button type="button" (click)="addRate()" [class]="textButtonClass + ' justify-self-start'">
        <app-icon name="plus" [size]="18" />
        Preisstufe hinzufügen
      </button>
    </fieldset>

    @if (method().kind === 'local_delivery') {
      <label class="block">
        <span [class]="labelClass">Liefergebiet (Postleitzahlen)</span>
        <textarea
          name="postalCodes"
          rows="4"
          [class]="textareaClass + ' font-mono'"
          [ngModel]="postalCodes()"
          (ngModelChange)="postalCodes.set($event)"
        ></textarea>
        <span [class]="hintClass"
          >{{ parsedPostalCodes().length }} gültige Postleitzahlen, getrennt mit Komma, Leerzeichen
          oder Zeilenumbruch.</span
        >
      </label>
    }

    @if (method().kind === 'pickup') {
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span [class]="labelClass">Abholort</span>
          <input
            name="pickupLocation"
            [class]="fieldClass"
            [ngModel]="pickupLocation()"
            (ngModelChange)="pickupLocation.set($event)"
          />
        </label>
        <label class="block">
          <span [class]="labelClass">Öffnungszeiten</span>
          <input
            name="pickupHours"
            [class]="fieldClass"
            [ngModel]="pickupHours()"
            (ngModelChange)="pickupHours.set($event)"
          />
        </label>
      </div>
    }

    @if (message(); as message) {
      <p
        class="rounded-xl p-3 text-sm"
        [class]="
          message.tone === 'ok'
            ? 'bg-success-soft text-success-strong'
            : 'bg-danger-soft text-danger-strong'
        "
        role="status"
      >
        {{ message.text }}
      </p>
    }

    <div class="flex justify-end">
      <button type="submit" [disabled]="saving()" [class]="primaryButtonClass">
        <app-icon name="check" [size]="18" />
        {{ saving() ? 'Speichern …' : 'Speichern' }}
      </button>
    </div>
  </form>
</app-section-card>
