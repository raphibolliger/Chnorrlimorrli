<app-admin-dialog
  [title]="title()"
  [subtitle]="product() ? '/shop/' + form().slug : 'Danach kannst du Bilder hinzufügen.'"
  [dirty]="dirty()"
  [busy]="saving()"
  (dismissed)="dismissed.emit()"
>
  <form id="product-form" class="grid gap-6" (submit)="$event.preventDefault(); save()">
    @if (notice(); as notice) {
      <app-notice-banner [notice]="notice" />
    }

    <fieldset class="grid gap-4 md:grid-cols-2">
      <legend class="sr-only">Allgemein</legend>
      <h3 class="text-sm font-semibold text-gray-900 md:col-span-2">Allgemein</h3>
      <label class="block md:col-span-2">
        <span class="admin-label">Name</span>
        <input
          autofocus
          name="name"
          class="admin-field"
          [ngModel]="form().name"
          (ngModelChange)="updateName($event)"
          required
        />
      </label>
      <label class="block">
        <span class="admin-label">URL-Kürzel</span>
        <input
          name="slug"
          class="admin-field font-mono"
          [ngModel]="form().slug"
          (ngModelChange)="updateSlug($event)"
        />
        <span class="admin-hint">/shop/{{ form().slug }}</span>
      </label>
      <label class="block">
        <span class="admin-label">Art.-Nr.</span>
        <input
          name="sku"
          class="admin-field"
          [ngModel]="form().sku"
          (ngModelChange)="patch('sku', $event)"
        />
      </label>
      <label class="block">
        <span class="admin-label">Preis (CHF)</span>
        <input
          name="price"
          inputmode="decimal"
          placeholder="40.00"
          class="admin-field"
          [class.border-danger]="form().price !== '' && priceRappen() === null"
          [ngModel]="form().price"
          (ngModelChange)="patch('price', $event)"
        />
      </label>
      <label class="block">
        <span class="admin-label">Reihenfolge</span>
        <input
          name="sortOrder"
          type="number"
          class="admin-field"
          [ngModel]="form().sortOrder"
          (ngModelChange)="patch('sortOrder', $event)"
        />
      </label>
      <label class="block md:col-span-2">
        <span class="admin-label">Kurzbeschreibung</span>
        <input
          name="shortDescription"
          class="admin-field"
          [ngModel]="form().shortDescription"
          (ngModelChange)="patch('shortDescription', $event)"
        />
        <span class="admin-hint">Erscheint in der Produktliste des Shops.</span>
      </label>
      <label class="block md:col-span-2">
        <span class="admin-label">Beschreibung</span>
        <textarea
          name="description"
          rows="6"
          class="admin-textarea"
          [ngModel]="form().description"
          (ngModelChange)="patch('description', $event)"
        ></textarea>
        <span class="admin-hint">Eine Leerzeile beginnt einen neuen Absatz.</span>
      </label>
      <label class="flex items-center gap-2 text-sm font-medium text-gray-800">
        <input
          type="checkbox"
          name="active"
          class="admin-checkbox"
          [ngModel]="form().active"
          (ngModelChange)="patch('active', $event)"
        />
        Im Shop sichtbar
      </label>
    </fieldset>

    <fieldset class="grid gap-3 border-t border-gray-100 pt-5">
      <legend class="sr-only">Lager</legend>
      <h3 class="text-sm font-semibold text-gray-900">Lager</h3>
      <label class="flex items-center gap-2 text-sm text-gray-800">
        <input
          type="checkbox"
          name="trackStock"
          class="admin-checkbox"
          [ngModel]="form().trackStock"
          (ngModelChange)="patch('trackStock', $event)"
        />
        Lagerbestand führen
      </label>
      @if (form().trackStock) {
        <label class="block max-w-40">
          <span class="admin-label">Stück an Lager</span>
          <input
            name="stock"
            type="number"
            min="0"
            class="admin-field"
            [ngModel]="form().stock"
            (ngModelChange)="patch('stock', $event)"
          />
        </label>
      } @else {
        <p class="text-sm text-gray-500">Unbegrenzt bestellbar.</p>
      }
    </fieldset>

    <fieldset class="grid gap-3 border-t border-gray-100 pt-5">
      <legend class="sr-only">Optionen</legend>
      <div>
        <h3 class="text-sm font-semibold text-gray-900">Optionen</h3>
        <p class="admin-hint">Zum Beispiel Grösse mit den Werten «31-35, 39-46».</p>
      </div>
      <div class="grid gap-3">
        @for (option of form().options; track $index; let index = $index) {
          <div
            class="grid gap-2 rounded-xl bg-gray-50 p-3 sm:grid-cols-[minmax(0,180px)_1fr_auto] sm:items-center"
          >
            <input
              [name]="'optionName' + index"
              class="admin-field"
              [ngModel]="option.name"
              (ngModelChange)="updateOption(index, 'name', $event)"
              placeholder="Name, z. B. Grösse"
              aria-label="Name der Option"
            />
            <input
              [name]="'optionChoices' + index"
              class="admin-field"
              [ngModel]="option.choices"
              (ngModelChange)="updateOption(index, 'choices', $event)"
              placeholder="Werte, mit Komma getrennt"
              aria-label="Werte der Option"
            />
            <button
              type="button"
              (click)="removeOption(index)"
              class="inline-flex size-10 items-center justify-center rounded-full text-gray-500 hover:bg-gray-200 hover:text-danger"
              aria-label="Option entfernen"
            >
              <app-icon name="trash" [size]="18" />
            </button>
          </div>
        }
        <button type="button" (click)="addOption()" class="admin-button-text justify-self-start">
          <app-icon name="plus" [size]="18" />
          Option hinzufügen
        </button>
      </div>
    </fieldset>
  </form>

  <button
    dialogActions
    type="submit"
    form="product-form"
    [disabled]="saving()"
    class="admin-button-primary"
  >
    <app-icon name="check" [size]="18" />
    {{ saving() ? 'Speichern …' : 'Speichern' }}
  </button>
</app-admin-dialog>
