<app-admin-page-header title="Versand" subtitle="Änderungen gelten sofort an der Kasse" />

<div class="grid gap-4 p-4 md:p-0">
  @if (methods.isLoading() && !methods.hasValue()) {
    <app-list-skeleton [rows]="3" />
  } @else if (methods.error()) {
    <p class="rounded-xl bg-danger-soft p-4 text-sm text-danger-strong">
      Die Versandmethoden konnten nicht geladen werden.
    </p>
  } @else {
    @for (method of methods.value(); track method.id) {
      <app-shipping-method-form [method]="method" (saved)="methods.reload()" />
    }
  }
</div>
