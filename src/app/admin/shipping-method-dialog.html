<app-admin-dialog
  title="Versandmethode bearbeiten"
  [subtitle]="kind().label"
  [dirty]="dirty()"
  [busy]="saving()"
  (dismissed)="dismissed.emit()"
>
  <form id="shipping-form" class="grid gap-4" (submit)="$event.preventDefault(); save()">
    @if (notice(); as notice) {
      <app-notice-banner [notice]="notice" />
    }

    <div class="grid gap-4 md:grid-cols-[1fr_minmax(0,140px)]">
      <label class="block">
        <span class="admin-label">Name an der Kasse</span>
        <input
          autofocus
          name="name"
          class="admin-field"
          [ngModel]="form().name"
          (ngModelChange)="patch('name', $event)"
        />
      </label>
      <label class="block">
        <span class="admin-label">Reihenfolge</span>
        <input
          name="sortOrder"
          type="number"
          class="admin-field"
          [ngModel]="form().sortOrder"
          (ngModelChange)="patch('sortOrder', $event)"
        />
      </label>
    </div>

    <label class="block">
      <span class="admin-label">Beschreibung für Kundinnen und Kunden</span>
      <textarea
        name="description"
        rows="2"
        class="admin-textarea"
        [ngModel]="form().description"
        (ngModelChange)="patch('description', $event)"
      ></textarea>
    </label>

    <label class="flex items-center gap-2 text-sm font-medium text-gray-800">
      <input
        type="checkbox"
        name="active"
        class="admin-checkbox"
        [ngModel]="form().active"
        (ngModelChange)="patch('active', $event)"
      />
      An der Kasse anbieten
    </label>

    <fieldset class="grid gap-2">
      <legend class="admin-label">Preisstufen nach Warenwert</legend>
      @for (rate of form().rates; track $index; let index = $index) {
        <div
          class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_2.5rem] items-end gap-2 md:max-w-lg"
        >
          <label class="block">
            <span class="mb-1 block text-xs text-gray-500">Warenwert ab CHF</span>
            <input
              class="admin-field"
              [ngModel]="rate.from"
              (ngModelChange)="updateRate(index, 'from', $event)"
              [ngModelOptions]="{ standalone: true }"
              inputmode="decimal"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-xs text-gray-500">Versandkosten CHF</span>
            <input
              class="admin-field"
              [ngModel]="rate.price"
              (ngModelChange)="updateRate(index, 'price', $event)"
              [ngModelOptions]="{ standalone: true }"
              inputmode="decimal"
            />
          </label>
          @if (form().rates.length > 1) {
            <button
              type="button"
              (click)="removeRate(index)"
              class="inline-flex size-10 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 hover:text-danger"
              aria-label="Preisstufe entfernen"
            >
              <app-icon name="trash" [size]="18" />
            </button>
          }
        </div>
      }
      <button type="button" (click)="addRate()" class="admin-button-text justify-self-start">
        <app-icon name="plus" [size]="18" />
        Preisstufe hinzufügen
      </button>
    </fieldset>

    @if (method().kind === 'local_delivery') {
      <label class="block">
        <span class="admin-label">Liefergebiet (Postleitzahlen)</span>
        <textarea
          name="postalCodes"
          rows="4"
          class="admin-textarea font-mono"
          [ngModel]="form().postalCodes"
          (ngModelChange)="patch('postalCodes', $event)"
        ></textarea>
        <span class="admin-hint"
          >{{ parsedPostalCodes().length }} gültige Postleitzahlen, getrennt mit Komma, Leerzeichen
          oder Zeilenumbruch.</span
        >
      </label>
    }

    @if (method().kind === 'pickup') {
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block">
          <span class="admin-label">Abholort</span>
          <input
            name="pickupLocation"
            class="admin-field"
            [ngModel]="form().pickupLocation"
            (ngModelChange)="patch('pickupLocation', $event)"
          />
        </label>
        <label class="block">
          <span class="admin-label">Öffnungszeiten</span>
          <input
            name="pickupHours"
            class="admin-field"
            [ngModel]="form().pickupHours"
            (ngModelChange)="patch('pickupHours', $event)"
          />
        </label>
      </div>
    }
  </form>

  <button
    dialogActions
    type="submit"
    form="shipping-form"
    [disabled]="saving()"
    class="admin-button-primary"
  >
    <app-icon name="check" [size]="18" />
    {{ saving() ? 'Speichern …' : 'Speichern' }}
  </button>
</app-admin-dialog>
