<section class="flex min-h-dvh items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex items-center justify-center gap-2">
      <app-site-image name="logo" alt="" sizes="36px" imageClass="size-9 rounded-full" />
      <span class="text-base font-semibold">Chnorrlimorrli</span>
      <span class="text-base text-gray-400">Verwaltung</span>
    </div>
    <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-gray-200">
      <h1 class="text-xl font-semibold">Anmelden</h1>

      @if (step() === 'email') {
        <p class="mt-1 text-sm text-gray-500">Wir schicken dir einen Code per E-Mail.</p>
        <form class="mt-5 grid gap-4" (submit)="$event.preventDefault(); requestCode()">
          <label class="block">
            <span class="admin-label">E-Mail-Adresse</span>
            <input
              type="email"
              name="email"
              autocomplete="email"
              required
              class="admin-field"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
            />
          </label>
          <button type="submit" [disabled]="busy()" class="admin-button-primary w-full">
            {{ busy() ? 'Einen Moment …' : 'Code anfordern' }}
          </button>
        </form>
      } @else {
        <p class="mt-1 text-sm text-gray-500">
          Falls <span class="font-medium text-gray-800">{{ email() }}</span> Zugang hat, ist ein
          6-stelliger Code unterwegs.
        </p>
        <form class="mt-5 grid gap-4" (submit)="$event.preventDefault(); verifyCode()">
          <label class="block">
            <span class="admin-label">Code</span>
            <input
              name="code"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              required
              class="admin-field text-center text-lg font-semibold tracking-[0.5em]"
              [ngModel]="code()"
              (ngModelChange)="code.set($event)"
            />
          </label>
          <button
            type="submit"
            [disabled]="busy() || code().length !== 6"
            class="admin-button-primary w-full"
          >
            {{ busy() ? 'Einen Moment …' : 'Anmelden' }}
          </button>
          <button type="button" (click)="restart()" class="admin-button-text justify-center">
            Andere Adresse verwenden
          </button>
        </form>
      }

      @if (message()) {
        <p class="mt-4 rounded-xl bg-danger-soft p-3 text-sm text-danger-strong" role="alert">
          {{ message() }}
        </p>
      }
    </div>
  </div>
</section>
