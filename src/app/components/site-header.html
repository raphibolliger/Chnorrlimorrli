<header class="sticky top-0 z-40 border-b border-ink/10 bg-cream/95 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-2 px-3 sm:gap-4 sm:px-4">
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="flex items-center gap-2"
      aria-label="Zur Startseite"
    >
      <app-site-image name="logo" alt="" sizes="44px" imageClass="size-11 rounded-full" />
      <span class="font-display text-xl font-semibold tracking-tight text-navy"
        >Chnorrlimorrli</span
      >
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Hauptnavigation">
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="rounded-full px-3 py-2 text-sm font-medium text-ink/80 transition hover:bg-mais-100 hover:text-navy aria-[current=page]:bg-mais-100 aria-[current=page]:text-navy"
          >{{ item.label }}</a
        >
      }
      <a
        routerLink="/shop"
        routerLinkActive="ring-2 ring-navy"
        class="ml-2 rounded-full bg-navy px-4 py-2 text-sm font-semibold text-white transition hover:bg-navy-800"
        >Shop</a
      >
      <a
        routerLink="/warenkorb"
        (click)="closeMenu()"
        class="relative inline-flex size-11 items-center justify-center rounded-full text-navy hover:bg-mais-100"
        [attr.aria-label]="'Warenkorb, ' + cart.count() + ' Artikel'"
      >
        <svg
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"
          />
          <circle cx="10" cy="20" r="1.2" />
          <circle cx="17" cy="20" r="1.2" />
        </svg>
        <span
          class="absolute -top-0.5 -right-0.5 min-w-5 rounded-full bg-mais px-1 text-center text-xs leading-5 font-bold text-navy"
          [class.hidden]="cart.count() === 0"
          aria-hidden="true"
          >{{ cart.count() }}</span
        >
      </a>
    </nav>

    <div class="flex shrink-0 items-center gap-0.5 lg:hidden">
      <a
        routerLink="/shop"
        (click)="closeMenu()"
        class="rounded-full bg-navy px-4 py-2 text-sm font-semibold text-white"
        >Shop</a
      >
      <a
        routerLink="/warenkorb"
        (click)="closeMenu()"
        class="relative inline-flex size-11 items-center justify-center rounded-full text-navy hover:bg-mais-100"
        [attr.aria-label]="'Warenkorb, ' + cart.count() + ' Artikel'"
      >
        <svg
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"
          />
          <circle cx="10" cy="20" r="1.2" />
          <circle cx="17" cy="20" r="1.2" />
        </svg>
        <span
          class="absolute -top-0.5 -right-0.5 min-w-5 rounded-full bg-mais px-1 text-center text-xs leading-5 font-bold text-navy"
          [class.hidden]="cart.count() === 0"
          aria-hidden="true"
          >{{ cart.count() }}</span
        >
      </a>

      <button
        type="button"
        (click)="toggleMenu()"
        class="inline-flex size-11 items-center justify-center rounded-full text-navy hover:bg-mais-100"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Menü schliessen' : 'Menü öffnen'"
      >
        @if (menuOpen()) {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        } @else {
          <svg
            viewBox="0 0 24 24"
            class="size-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-menu"
      class="border-t border-ink/10 bg-cream lg:hidden"
      aria-label="Hauptnavigation"
    >
      <ul class="mx-auto flex max-w-6xl flex-col px-4 py-3">
        <li>
          <a
            routerLink="/"
            (click)="closeMenu()"
            class="block rounded-xl px-3 py-3 font-medium hover:bg-mais-100"
            >Startseite</a
          >
        </li>
        @for (item of navigation; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              (click)="closeMenu()"
              routerLinkActive
              ariaCurrentWhenActive="page"
              class="block rounded-xl px-3 py-3 font-medium hover:bg-mais-100 aria-[current=page]:bg-mais-100 aria-[current=page]:text-navy"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  }
</header>
