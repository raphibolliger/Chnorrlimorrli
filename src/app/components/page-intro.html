<section class="bg-mais">
  <div class="mx-auto max-w-6xl px-4 pt-10 pb-12 sm:pt-14 sm:pb-16">
    @if (eyebrow()) {
      <p class="text-sm font-semibold tracking-wide text-navy/70 uppercase">{{ eyebrow() }}</p>
    }
    <h1 class="mt-2 text-4xl font-bold text-navy sm:text-5xl">{{ title() }}</h1>
    @if (lead()) {
      <p class="mt-4 max-w-2xl text-lg leading-relaxed text-navy/85">{{ lead() }}</p>
    }
    <ng-content />
  </div>
</section>
