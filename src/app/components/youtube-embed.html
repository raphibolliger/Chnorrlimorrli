<div class="relative aspect-video overflow-hidden rounded-3xl bg-navy shadow-lg">
  @if (playing()) {
    <iframe
      class="absolute inset-0 size-full"
      [src]="embedUrl()"
      [title]="title()"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
      "
      allowfullscreen
    ></iframe>
  } @else {
    <button
      type="button"
      (click)="playing.set(true)"
      class="group absolute inset-0 flex flex-col items-center justify-center gap-4 bg-[radial-gradient(circle_at_30%_30%,var(--color-mais)_0,var(--color-mais-600)_45%,var(--color-navy)_100%)] p-6 text-center text-white"
    >
      <span
        class="flex size-20 items-center justify-center rounded-full bg-white/95 text-navy shadow-xl transition group-hover:scale-105"
      >
        <svg viewBox="0 0 24 24" class="ml-1 size-9" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </span>
      <span class="font-display text-xl font-semibold drop-shadow">{{ title() }} abspielen</span>
      <span class="max-w-sm text-xs text-white/85"
        >Das Video wird erst nach dem Klick von YouTube geladen.</span
      >
    </button>
  }
</div>
